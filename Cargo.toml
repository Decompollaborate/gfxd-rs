[package]
name = "gfxd-rs"
edition = "2018"
version = "0.1.0"
authors = [
    "Anghelo Carvajal <angheloalf95@gmail.com>",
]
repository = "https://github.com/Decompollaborate/gfxd-rs"
license = "MIT"
# description = ""
readme = "README.md"
keywords = [
    "disassembler",
    "n64",
    "nintendo",
    "no_std",
    "bindings",
]
categories = [
    "parsing",
    "api-bindings",
    "no-std",
]

# Use https://github.com/foresterre/cargo-msrv to check the MSRV
# ```
# cargo install cargo-msrv --locked --force
# cargo msrv find
# ```
#
# Don't forget to update this in CI too.
rust-version = "1.64.0"

[lib]
path = "src/lib.rs"

[features]
default = []
std = ["gfxd-sys/std"]

[dependencies]
gfxd-sys = { git = "https://github.com/Decompollaborate/gfxd-sys.git", default-features = false }
# gfxd-sys = { path = "../gfxd-sys/", default-features = false }

[dev-dependencies]
pretty_assertions = "1"
